<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Sistem Bilangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4">Kalkulator Sistem Bilangan</h4>

        <div class="mb-3">
          <label for="inputAngka" class="form-label">Bilangan</label>
          <input type="text" id="inputAngka" class="form-control" placeholder="Contoh: 255">
        </div>

        <div class="mb-3">
          <label for="dari" class="form-label">Dari sistem</label>
          <select id="dari" class="form-select">
            <option value="10" selected>Desimal (10)</option>
            <option value="2">Biner (2)</option>
            <option value="8">Oktal (8)</option>
            <option value="16">Heksadesimal (16)</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="ke" class="form-label">Ke sistem</label>
          <select id="ke" class="form-select">
            <option value="10">Desimal (10)</option>
            <option value="2" selected>Biner (2)</option>
            <option value="8">Oktal (8)</option>
            <option value="16">Heksadesimal (16)</option>
          </select>
        </div>

        <button type="button" class="btn btn-primary w-100" onclick="konversikan()">Konversi</button>

        <div class="text-center mt-4">
          <div class="text-muted small">Hasil</div>
          <div id="hasil" class="display-4 fw-bold text-break">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function konversikan() {
      const input = document.getElementById("inputAngka").value.trim();
      const dari = parseInt(document.getElementById("dari").value);
      const ke = parseInt(document.getElementById("ke").value);
      const hasil = document.getElementById("hasil");

      if (input === "") {
        hasil.textContent = "Isi bilangan dulu";
        hasil.className = "display-6 fw-bold text-danger";
        return;
      }

      const pola = {
        2: /^[01]+$/,
        8: /^[0-7]+$/,
        10: /^[0-9]+$/,
        16: /^[0-9a-fA-F]+$/
      };

      if (!pola[dari].test(input)) {
        hasil.textContent = "Input tidak sesuai sistem asal";
        hasil.className = "display-6 fw-bold text-danger";
        return;
      }

      const desimal = parseInt(input, dari);
      hasil.textContent = desimal.toString(ke).toUpperCase();
      hasil.className = "display-4 fw-bold text-break";
    }
  </script>
</body>
</html>
